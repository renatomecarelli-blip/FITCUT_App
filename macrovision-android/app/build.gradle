plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.renatomecarelli.macrovision'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.renatomecarelli.macrovision'
        minSdk 24
        targetSdk 36
        // Ad ogni aggiornamento sul Play Store: versionCode +1
        versionCode 1
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    // Scanner di codici a barre di Google Play Services: nessun permesso fotocamera richiesto all'app
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
}
