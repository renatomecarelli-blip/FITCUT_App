<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanze</title>
<style>
:root {
  /* direzione: lo "scontrino del giorno" in alto, il resto sobrio come un libretto di conti */
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --paper: #FBFAF5;
  --ink: #17211E;
  --muted: #5D6A65;
  --line: #D7DFDA;
  --accent: #1E6B55;
  --accent-soft: #DCEDE6;
  --on-accent: #FFFFFF;
  --good: #1E7A4F;
  --warn: #A86A12;
  --warn-soft: #F6E8CF;
  --bad: #B23A33;
  --bad-soft: #F6DCD9;
  --shadow: 0 1px 2px rgba(20, 35, 30, .06), 0 6px 18px rgba(20, 35, 30, .06);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #16201C; --paper: #1B2521; --ink: #E6EEEA; --muted: #9AAAA3; --line: #2A3732;
    --accent: #55B996; --accent-soft: #1D3A30; --on-accent: #08150F; --good: #5CC08F; --warn: #E3A84B; --warn-soft: #3A2E18;
    --bad: #EE7A72; --bad-soft: #3D2321; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #16201C; --paper: #1B2521; --ink: #E6EEEA; --muted: #9AAAA3; --line: #2A3732;
  --accent: #55B996; --accent-soft: #1D3A30; --on-accent: #08150F; --good: #5CC08F; --warn: #E3A84B; --warn-soft: #3A2E18;
  --bad: #EE7A72; --bad-soft: #3D2321; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num, .mono { font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding: calc(10px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 2px 12px; }
.top h1 { font: 800 22px/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
.top .per { font-size: 13px; color: var(--muted); text-align: right; }
.sync { font-size: 12px; color: var(--muted); }
.sync.err { color: var(--bad); }
main { display: grid; gap: 14px; }
h2 { font: 800 17px/1.2 var(--display); margin: 0; text-wrap: balance; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card > header small { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
/* 🧾 lo scontrino di oggi */
.receipt { position: relative; background: var(--paper); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 18px 18px 26px; box-shadow: var(--shadow);
  -webkit-mask: radial-gradient(9px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x; mask: radial-gradient(9px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x; }
.receipt .lbl { font: 500 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.big { font: 800 clamp(52px, 17vw, 76px)/1 var(--display); letter-spacing: -.03em; margin: 10px 0 6px; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.big .eur { font-size: .42em; font-weight: 600; color: var(--muted); }
.big.neg { color: var(--bad); }
.sforo { color: var(--bad); }
.big .eur { white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.rows { display: grid; gap: 4px; margin-top: 12px; font: 400 13.5px/1.5 var(--mono); }
.rows div { display: flex; gap: 8px; align-items: baseline; }
.rows div span:first-child { white-space: nowrap; }
.rows div i { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.rows div b { font-weight: 500; white-space: nowrap; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 12px; border-radius: 10px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: default; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font: 800 21px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.alert { border-color: var(--warn); }
.list { display: grid; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.list .item:first-child { border-top: 0; }
.item .t { font-weight: 600; font-size: 15px; line-height: 1.25; }
.item .d { font-size: 12.5px; color: var(--muted); }
.item .a { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.item .a.plus { color: var(--good); }
.item .a.soft { color: var(--muted); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.date { font: 500 12px/1 var(--mono); color: var(--muted); width: 44px; text-align: center; text-transform: uppercase; }
.date b { display: block; font: 800 18px/1 var(--display); color: var(--ink); margin-bottom: 2px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.day { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 2px 4px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.catrow .bar { grid-column: 1 / -1; height: 6px; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.check .t { flex: 1; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; width: 100%; min-height: 46px; }
.field input.amount { font: 800 30px/1 var(--display); padding: 12px; font-variant-numeric: tabular-nums; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.cats button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.months button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 0; font-size: 13px; }
.months button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
nav.tabs svg { width: 22px; height: 22px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 20; display: none; }
.sheet-bg.on { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 92%; overflow: auto; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .22s ease; box-shadow: 0 -10px 30px rgba(0, 0, 0, .18); }
.sheet:not(.on) { visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.sheet.on { transform: none; }
.sheet .in { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.sheet .grab { width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 2px; }
.sheet h3 { font: 800 20px/1.2 var(--display); margin: 0; }
.sheet .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
.listen { position: fixed; inset: 0; z-index: 25; background: rgba(8, 14, 12, .72); display: none; place-items: center; padding: 24px; }
.listen.on { display: grid; }
.listen .box { background: var(--surface); border-radius: 20px; padding: 22px; max-width: 420px; width: 100%; display: grid; gap: 14px; text-align: center; }
.pulse { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 18%, transparent); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .sheet { transition: none; } }
.note { border-radius: 14px; padding: 12px 14px; background: var(--warn-soft); color: var(--ink); font-size: 14px; display: grid; gap: 8px; }
.note.ok { background: var(--accent-soft); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.periodnav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.periodnav strong { text-align: center; font-weight: 700; }
.loading { display: grid; place-items: center; min-height: 50vh; color: var(--muted); text-align: center; gap: 8px; }
textarea.json { font: 12px/1.4 var(--mono); min-height: 160px; }
@media (min-width: 520px) { .tiles { grid-template-columns: 1fr 1fr 1fr; } }
a.btn { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
a.btn.primary { color: var(--on-accent); }
.tag.auto { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.riga-btn { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrl { border-top: 1px solid var(--line); padding-bottom: 10px; }
.list .ctrl:first-child { border-top: 0; }
.ctrl .item { border-top: 0; }
.item.stato { grid-template-columns: auto 1fr auto; }
.pallino { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); margin: 0 6px; }
.pallino.si { background: var(--good); }
.card > header small.si { color: var(--good); font-weight: 700; }
.card > header small.no { color: var(--warn); font-weight: 700; }
h3.sub { font: 800 15px/1.2 var(--display); margin: 6px 0 0; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1 id="titolo">Finanze</h1><div class="per"><div id="perLbl"></div><div class="sync" id="sync"></div></div></div>
  <main id="view"><div class="loading"><div>Carico i tuoi conti…</div></div></main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="in">
  <a href="#oggi" data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Oggi</a>
  <a href="#movimenti" data-tab="movimenti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Movimenti</a>
  <a href="#conti" data-tab="conti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Conti</a>
  <a href="#fisse" data-tab="fisse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Fisse</a>
  <a href="#impostazioni" data-tab="impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Impostazioni</a>
</div></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in" id="sheetIn"></div></div>
<div class="listen" id="listen"><div class="box">
  <div class="pulse" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
  <div><strong>Ti ascolto</strong><div class="muted small">Di' quanto e dove, per esempio «3 euro e 50 al bar»</div></div>
  <div id="listenTxt" class="mono" style="min-height:1.5em"></div>
  <button class="btn primary" id="listenStop">Fatto</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script>
<script src="comune.js"></script>
<script src="ponte.js"></script>
<script src="app.js"></script>
</body>
</html>
