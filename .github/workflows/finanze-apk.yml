name: APK Finanze

on:
  push:
    paths: ['android/**', '.github/workflows/finanze-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finanze-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Metti l'APK (o gli errori) nel progetto
        if: always()
        run: |
          mkdir -p apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk/Finanze.apk
            echo "ok versione 1.${{ github.run_number }}" > apk/esito.txt
          else
            { echo "errore versione 1.${{ github.run_number }}"; grep -n "error:\|FAILURE\|What went wrong\|e: \|> " build.log | head -60; echo ----; tail -n 80 build.log; } > apk/esito.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "APK 1.${{ github.run_number }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
