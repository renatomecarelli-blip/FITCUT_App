/* Layout: una colonna da telefono (max 520px). Barra in basso con il pulsante + al centro.
   L'unico elemento vistoso è il "mirino" delle calorie, una ghiera da obiettivo macro. */
:root {
  --ink-0: #090B14;      /* fondo */
  --ink-1: #10131F;      /* superfici */
  --ink-2: #171B2A;      /* fogli e superfici rialzate */
  --ink-3: #20253A;      /* campi e controlli */
  --line: #272C40;
  --text: #EEF1FA;
  --text-2: #A9B0C6;
  --text-3: #7A82A0;
  --kcal: #FFB020;
  --pro: #2EE6FF;
  --carb: #4CF08A;
  --fat: #FF5FA2;
  --brand-a: #2EE6FF;
  --brand-b: #9B6BFF;
  --danger: #FF6B6B;
  --scrim: rgba(4, 5, 10, .72);
  --r-l: 24px;
  --r-m: 16px;
  --r-s: 11px;
  --font-display: 'Poppins', ui-sans-serif, system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --nav-h: 68px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ink-0);
  background-image:
    radial-gradient(900px 420px at 110% -8%, rgba(155, 107, 255, .16), transparent 60%),
    radial-gradient(700px 380px at -20% 4%, rgba(46, 230, 255, .10), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-appearance: none; appearance: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand-a); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 18px; height: 18px; }

/* ---------- struttura ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  margin: 0 -16px;
  background: rgba(9, 11, 20, .9);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 600 18px/1 var(--font-display); letter-spacing: -.01em; white-space: nowrap; }
.datenav { display: flex; align-items: center; gap: 2px; background: var(--ink-1); border: 1px solid var(--line); border-radius: 999px; padding: 3px; position: relative; }
.datenav button { background: none; border: 0; height: 34px; min-width: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--text-2); }
.datenav button:active { background: var(--ink-3); }
.datenav .day { padding: 0 10px; color: var(--text); font-weight: 600; font-size: 14px; white-space: nowrap; }
.datenav input { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.view { display: none; }
.view.on { display: block; animation: fadein .18s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
h2.sec { font: 600 17px/1.2 var(--font-display); margin: 26px 0 10px; letter-spacing: -.005em; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }

/* ---------- mirino calorie ---------- */
.hero { padding: 6px 0 4px; }
.lens { position: relative; width: min(228px, 62vw); aspect-ratio: 1; margin: 4px auto 0; max-width: 100%; }
.lens svg { width: 100%; height: 100%; display: block; overflow: visible; }
.lens .tick { stroke: var(--line); stroke-width: 1.4; }
.lens .tick.major { stroke: var(--text-3); stroke-width: 2; }
.lens .tick.lit { stroke: var(--kcal); }
.lens.over .tick.lit { stroke: var(--fat); }
.lens .track { stroke: rgba(255, 255, 255, .06); }
.lens .arc { stroke: var(--kcal); transition: stroke-dashoffset .7s cubic-bezier(.2, .8, .2, 1); filter: drop-shadow(0 0 6px rgba(255, 176, 32, .45)); }
.lens.over .arc { stroke: var(--fat); filter: drop-shadow(0 0 6px rgba(255, 95, 162, .5)); }
.lens .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.lens .big { font: 700 44px/1 var(--font-display); letter-spacing: -.02em; }
.lens .cap { color: var(--text-2); font-size: 13px; margin-top: 6px; }
.lens-stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin: 14px 0 6px; text-align: center; }
.lens-stats div { background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-m); padding: 9px 6px; }
.lens-stats b { display: block; font: 600 18px/1.2 var(--font-display); }
.lens-stats span { font-size: 12.5px; color: var(--text-2); }

.macros { display: grid; gap: 12px; margin-top: 16px; }
.macro .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.macro .row b { font-weight: 600; }
.macro .row span { color: var(--text-2); font-size: 13.5px; }
.bar { height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.c-kcal { background: var(--kcal); } .c-pro { background: var(--pro); } .c-carb { background: var(--carb); } .c-fat { background: var(--fat); }

/* ---------- pasti ---------- */
.meal { border-top: 1px solid var(--line); padding: 14px 0 6px; }
.meal:first-of-type { border-top: 0; }
.meal-head { display: flex; align-items: center; gap: 10px; }
.meal-head h3 { margin: 0; font: 600 16px/1.2 var(--font-display); flex: 1; }
.meal-head .kc { color: var(--text-2); font-size: 14px; }
.addbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink-1); color: var(--text); display: grid; place-items: center; }
.addbtn:active { background: var(--ink-3); }
.entries { list-style: none; margin: 6px 0 0; padding: 0; }
.entry { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-radius: var(--r-s); cursor: pointer; }
.entry:active { background: var(--ink-1); }
.entry .main { flex: 1; min-width: 0; }
.entry .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .mt { display: flex; gap: 10px; font-size: 12.5px; color: var(--text-3); margin-top: 1px; flex-wrap: wrap; }
.entry .mt em { font-style: normal; color: var(--text-2); }
.entry .kc { font-weight: 600; white-space: nowrap; }
.empty-meal { color: var(--text-3); font-size: 13.5px; padding: 4px 2px 8px; }

.water { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; margin-top: 18px; }
.water .lbl { flex: 1; min-width: 120px; }
.water .lbl b { font-weight: 600; }
.glasses { display: flex; gap: 4px; flex-wrap: wrap; }
.glass { width: 22px; height: 28px; border: 0; padding: 0; background: none; color: var(--text-3); }
.glass svg { width: 22px; height: 28px; }
.glass.on { color: var(--pro); }

.sheet {

/* ---------- scanner ---------- */
.scan { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; color: #fff; }

.reticle { position: absolute; left: 50%; top: 46%; width: min(84vw, 380px); height: min(46vw, 210px); transform: translate(-50%, -50%); pointer-events: none; border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); }
.reticle::before, .reticle::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--brand-a); border-radius: 18px;
  -webkit-mask: linear-gradient(#000 0 0) top left / 34px 34px no-repeat, linear-gradient(#000 0 0) top right / 34px 34px no-repeat, linear-gradient(#000 0 0) bottom left / 34px 34px no-repeat, linear-gradient(#000 0 0) bottom right / 34px 34px no-repeat;
  mask: linear-gradient(#000 0 0) top left / 34px 34px no-repeat, linear-gradient(#000 0 0) top right / 34px 34px no-repeat, linear-gradient(#000 0 0) bottom left / 34px 34px no-repeat, linear-gradient(#000 0 0) bottom right / 34px 34px no-repeat; }
.reticle::after { display: none; }

.reticle.hit::before { border-color: var(--carb); }
.scan-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 8px; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.chart { position: relative; margin-top: 12px; background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 10px 8px; }

}

}

<script id="mv-ean-src">
/*
 * MacroVision: decodificatore di codici a barre classici EAN-13, EAN-8 e UPC-A
 * (un UPC-A viene letto come EAN-13 con uno 0 davanti). Nessuna dipendenza.
 * Usato quando il telefono non offre il riconoscimento nativo (BarcodeDetector)
 * e per leggere le foto dei codici.
 */
(function (root) {

  function uniq(a) { var o = []; a.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }

  function removeEntry(dk, id) {

  }
  function deleteEntry(dk, id) {
    var r = removeEntry(dk, id);
    if (!r) return;

  /* ================= Scanner ================= */
  function openScanner() {
    // App Android: scanner di Google (Play Services), il più affidabile su qualsiasi codice
    if (NATIVE && NATIVE.scanBarcode && !UI.webScan) {
      window.MV_nativeScan = function (raw, fmt) {
        window.MV_nativeScan = null;
        if (raw == null) {
          if (fmt === 'error') { UI.webScan = true; toast('Lo scanner di Google non è disponibile: uso quello dell\'app.'); Sheet.push(webScannerScreen()); }
          return;
        }
        var code = gtinFromRaw(raw, fmt);
        if (!code) { toast('Questo codice non identifica un prodotto: inquadra il codice a barre della confezione.', { err: true }); return; }
        Sheet.push(codeScreen(code, { native: true }));
      };
      try { NATIVE.scanBarcode(); return; } catch (e) { window.MV_nativeScan = null; }
    }
    Sheet.push(webScannerScreen());
  }
  function webScannerScreen() { return { full: true, title: 'Codice a barre', render: scanScreen, onClose: function () { Scanner.stop(); } }; }
  function scanScreen(el) {
    el.innerHTML =
      '<div class="scan">' +
        '<video playsinline muted autoplay></video><div class="shade"></div>' +
        '<div class="reticle" id="sc-ret"><div class="laser"></div></div>' +
        '<div class="scan-top"><button class="iconbtn" data-a="x" aria-label="Chiudi">' + icon('close') + '</button>' +
          '<div class="row"><button class="iconbtn" data-a="zoom" aria-label="Ingrandisci" hidden>' + icon('zoom') + '</button><button class="iconbtn" data-a="torch" aria-label="Torcia" hidden>' + icon('flash') + '</button></div></div>' +
        '<div class="scan-fallback" id="sc-fb" hidden></div>' +

          '<div id="sc-type" hidden><div class="row"><input class="input num" id="sc-code" inputmode="numeric" placeholder="Es. 8001505005592" aria-label="Codice a barre" maxlength="14"><button class="btn primary" data-a="find">Cerca</button></div></div>' +
          '<div class="scan-alt" id="sc-alt"><button class="btn" data-a="photo">' + icon('camera', 'sm') + ' Fotografa</button><button class="btn" data-a="type">' + icon('keypad', 'sm') + ' Scrivi codice</button></div>' +

    function say(html) { msg.innerHTML = html; }
    function live() {
      fb.hidden = true; ret.hidden = false; ret.classList.remove('hit');
      say('Avvio la fotocamera…');
      Scanner.onQr = function () { say('<b>QR non riconosciuto</b>Questo QR non contiene il codice di un prodotto. Inquadra il codice a barre.'); };
      Scanner.start(video, found, function (state, caps) {
        if (state === 'live') {
          say('<b>Inquadra il codice a barre</b>EAN, UPC o QR del prodotto, dentro il riquadro');
          tBtn.hidden = !(caps && caps.torch);
          zBtn.hidden = !(caps && caps.zoom);
        } else {
          ret.hidden = true;
          fb.hidden = false;
          fb.innerHTML = icon('barcode') + (PREVIEW ? '<div><b>Fotocamera live non disponibile nell\'anteprima</b></div><div class="muted small">Tocca «Fotografa»: il codice viene letto dalla foto. Nell\'app installata la scansione è dal vivo.</div>' :
            '<div><b>' + (state === 'denied' ? 'Accesso alla fotocamera negato' : 'Fotocamera non disponibile') + '</b></div><div class="muted small">' +
            (state === 'denied' ? 'Consenti la fotocamera nelle impostazioni dell\'app, oppure fotografa il codice o scrivilo a mano.' : 'Puoi fotografare il codice o scriverlo a mano.') + '</div>');
          say('');

      });
    }
    function found(code) {
      Scanner.stop();
      ret.classList.add('hit');
      say('<b class="num">' + esc(code) + '</b>Codice letto');
      setTimeout(function () { var top = Sheet.stack[Sheet.stack.length - 1]; if (top && top.full) Sheet.replace(codeScreen(code)); }, 180);
    }
    el.querySelector('.scan').addEventListener('click', function (e) {
      var t = e.target.closest('[data-a]');
      if (!t) return;
      var a = t.getAttribute('data-a');

      else if (a === 'torch') Scanner.torch().then(function (on) { tBtn.classList.toggle('on', on); });
      else if (a === 'zoom') Scanner.zoom().then(function (on) { zBtn.classList.toggle('on', on); });
      else if (a === 'photo') $('#sc-file', el).click();

      }).catch(function () { say('<b>Non riesco ad aprire la foto</b>Riprova con un\'altra immagine.'); });
    });
    live();
  }

  /* ================= Prodotto dal codice a barre ================= */
  function codeKind(code) {
    if (code.length === 13 && /^97[89]/.test(code)) return 'book';
    if (code.length === 13 && /^977/.test(code)) return 'mag';
    if (code[0] === '2' && (code.length === 13 || code.length === 12 || code.length === 8)) return 'store';   // prodotti pesati al banco
    return '';
  }
  // Cerca il prodotto e, se non c'è, offre tutte le strade: etichetta letta dall'AI, ricerca del codice su internet, nome, valori a mano.
  function codeScreen(code, opts) {
    opts = opts || {};
    var kind = codeKind(code), food = kind !== 'book' && kind !== 'mag';
    var st = { phase: 'loading', food: null, err: '', ctl: null, dead: false, started: false, autoDone: false };
    var scr = {
      title: 'Codice a barre',
      onClose: function () { st.dead = true; if (st.ctl) st.ctl.abort(); },
      render: function (el) {
        if (!st.started) { st.started = true; start(el); return; }
        if (st.phase === 'loading' || st.phase === 'search' || st.phase === 'label') {
          var t = st.phase === 'loading' ? ['Cerco il prodotto…', 'Codice ' + code]
            : st.phase === 'search' ? ['Cerco il codice su internet…', 'L\'AI controlla siti di supermercati e produttori.'] : ['Leggo l\'etichetta…', 'Di solito servono pochi secondi.'];
          el.innerHTML = '<div class="busy">' + spinner() + '<div><b style="color:var(--text)">' + t[0] + '</b><div class="small num">' + esc(t[1]) + '</div></div>' +
            (st.phase !== 'loading' ? '<button class="btn ghost" data-a="stop">Annulla</button>' : '') + '</div>';
          var sb = $('[data-a=stop]', el);
          if (sb) sb.onclick = function () { if (st.ctl) st.ctl.abort(); st.ctl = null; st.phase = 'menu'; scr.render(el); };
          return;
        }
        var ai = AI.available(), head;
        if (st.phase === 'error') head = '<b>Non riesco a cercare il prodotto</b><span>' + (PREVIEW ? 'Nell\'anteprima la ricerca su Open Food Facts è bloccata: nell\'app installata qui compare il prodotto.' : 'Controlla la connessione e riprova.') + '</span>';
        else if (!food) head = '<b>Non è un alimento</b><span>Il codice ' + code + ' è di ' + (kind === 'book' ? 'un libro' : 'una rivista') + '. Inquadra il codice a barre sulla confezione del cibo.</span>';
        else if (kind === 'store' && !st.food) head = '<b>Codice interno del supermercato</b><span>I prodotti pesati al banco (salumi, formaggi, carne, frutta, pane) hanno un codice del negozio che non dice di che prodotto si tratta. Cercalo per nome o fotografa l\'etichetta.</span>';
        else if (st.food) head = '<b>' + esc(st.food.name) + '</b><span>' + (st.food.brand ? esc(st.food.brand) + '. ' : '') + 'Mancano i valori nutrizionali: aggiungili una volta e la prossima scansione li trova.</span>';
        else head = '<b>Prodotto non ancora nel database</b><span>Il codice ' + code + ' non è su Open Food Facts. Aggiungilo una volta: alla prossima scansione lo trovi subito.</span>';
        var opt = function (id, ic, title, sub) { return '<button class="opt" data-o="' + id + '">' + icon(ic) + '<div><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div></button>'; };
        var needAI = ai ? '' : ' (da attivare)';
        el.innerHTML = '<div class="stack">' +
          '<div class="code-head">' + icon('barcode') + '<div>' + head + '</div></div>' +
          (st.err ? '<div class="notice" role="alert">' + esc(st.err) + '</div>' : '') +
          '<div class="opt-list code-opts">' +
            (st.phase === 'error' ? opt('retry', 'refresh', 'Riprova', 'Cerca di nuovo il codice') : '') +
            (food ? opt('label', 'camera', 'Fotografa la tabella nutrizionale', 'L\'AI legge i valori dall\'etichetta' + needAI) : '') +
            (food && kind !== 'store' ? opt('search', 'sparkle', 'Cerca il codice su internet', 'L\'AI trova nome e valori del prodotto' + needAI) : '') +
            opt('name', 'search', 'Cerca per nome', 'Tra alimenti, piatti e marche') +
            (food ? opt('manual', 'keypad', 'Scrivi i valori a mano', 'Copiali dalla tabella sull\'etichetta') : '') +
            opt('rescan', 'barcode', 'Scansiona un altro codice', '') +
          '</div>' +
          (food && ai ? '<button class="linkbtn" data-a="gal" style="align-self:center">Usa una foto della galleria</button>' : '') +
          '<input type="file" accept="image/*" capture="environment" id="cs-cam" hidden><input type="file" accept="image/*" id="cs-gal" hidden>' +
        '</div>';
        $$('[data-o]', el).forEach(function (b) { b.onclick = function () { act(b.getAttribute('data-o'), el); }; });
        var pickF = function () { var f = this.files && this.files[0]; this.value = ''; if (f) runLabel(f, el); };
        $('#cs-cam', el).onchange = pickF; $('#cs-gal', el).onchange = pickF;
        var gb = $('[data-a=gal]', el);
        if (gb) gb.onclick = function () { $('#cs-gal', el).click(); };
      }
    };
    function start(el) {
      st.phase = 'loading'; st.err = ''; scr.render(el);
      lookupCode(code).then(function (f) {
        if (st.dead) return;
        if (f && !f.incomplete) { Sheet.replace(foodScreen(f, { meal: UI.addMeal || defaultMeal(), fromAdd: true })); return; }
        st.food = f; st.phase = 'menu';
        // con l'AI attiva il codice si cerca subito anche su internet
        if (food && !kind && AI.available() && !st.autoDone) { st.autoDone = true; runSearch(el); return; }
        scr.render(el);
      }).catch(function () { if (st.dead) return; st.phase = 'error'; scr.render(el); });
    }
    function act(id, el) {
      st.err = '';
      if ((id === 'label' || id === 'search') && !AI.available()) { Sheet.push(aiSetupScreen(function () { Sheet.back(); })); return; }
      if (id === 'retry') start(el);
      else if (id === 'label') $('#cs-cam', el).click();
      else if (id === 'search') runSearch(el);
      else if (id === 'name') {
        UI.pendingQ = (st.food && st.food.name) || '';
        var below = Sheet.stack[Sheet.stack.length - 2];

      }
      else if (id === 'manual') Sheet.replace(manualScreen({ toDiary: true, saveMine: true, code: code, name: st.food ? st.food.name : '', brand: st.food ? st.food.brand : '' }));
      else if (id === 'rescan') { if (opts.native) Sheet.back(function () { openScanner(); }); else Sheet.replace(webScannerScreen()); }
    }
    function fromAI(res, how) {
      return {
        toDiary: true, saveMine: true, code: code,
        name: res.name || (st.food && st.food.name) || '', brand: res.brand || (st.food && st.food.brand) || '',
        per: res.unit === 'ml' ? '100ml' : '100g', vals: res.vals, qty: res.serving || 100,
        info: how === 'label' ? 'Valori letti dall\'etichetta con l\'AI: controlla che siano giusti prima di salvare.' : 'Valori trovati su internet dall\'AI: confrontali con l\'etichetta prima di salvare.',

      aiProduct('search', { code: code, name: st.food && st.food.name, brand: st.food && st.food.brand }, ctl.signal).then(function (res) {
        if (st.dead || st.ctl !== ctl) return;
        if (res.found && res.vals) { Sheet.replace(manualScreen(fromAI(res, 'search'))); return; }
        if (res.found && res.name && !st.food) st.food = { name: res.name, brand: res.brand };
        st.phase = 'menu';
        var why = res.note ? res.note.replace(/\s*$/, '').replace(/([^.!?])$/, '$1.') + ' ' : 'Non ho trovato questo codice su internet. ';
        st.err = st.food ? 'Ho trovato il prodotto ma non i suoi valori: fotografa la tabella nutrizionale o scrivili a mano.' : why + 'Fotografa la tabella nutrizionale o scrivi i valori.';
        scr.render(el);
      }).catch(function (e) { if (!st.dead && st.ctl === ctl) fail(e, el); });
    }
    function runLabel(file, el) {
      var ctl = st.ctl = new AbortController();
      st.phase = 'label'; st.err = ''; scr.render(el);
      imageToJpeg(file, 1600).then(function (img) {
        if (st.dead || st.ctl !== ctl) return null;
        return aiProduct('label', { image: img, hint: st.food ? [st.food.name, st.food.brand].filter(Boolean).join(', ') : '' }, ctl.signal);
      }).then(function (res) {
        if (!res || st.dead || st.ctl !== ctl) return;
        if (res.vals) { Sheet.replace(manualScreen(fromAI(res, 'label'))); return; }
        st.phase = 'menu';
        st.err = res.note || 'Non riesco a leggere la tabella nutrizionale: avvicinati, mettila a fuoco e riprova.';
        scr.render(el);
      }).catch(function (e) { if (!st.dead && st.ctl === ctl) fail(e, el); });
    }
    return scr;
  }

  /* ================= AI ================= */
  function aiErrMsg(e) {
    if (e && e.code === 'not_granted') return 'Per usare l\'AI in questa anteprima consenti l\'accesso a Claude.';

  /* ---------- backup ---------- */
  function exportBackup() {
    if (PREVIEW) { toast('Nell\'anteprima il backup su file non è disponibile: funziona nell\'app installata.'); return; }
    var name = 'macrovision-backup-' + dkey(new Date()) + '.json';
    var data = JSON.stringify({ app: 'MacroVision', v: 2, exported: new Date().toISOString(), state: Object.assign({}, S, { aiKey: undefined, aiModel: undefined, aiThink: undefined }) });
    if (NATIVE && NATIVE.saveFile) {
      window.MV_nativeSaved = function (ok) { toast(ok ? 'Backup salvato: ' + name : 'Backup non salvato'); };
      try { NATIVE.saveFile(name, 'application/json', data); return; } catch (e) { /* ripiego sotto */ }
    }
    var file;
    try { file = new File([data], name, { type: 'application/json' }); } catch (e) { file = new Blob([data], { type: 'application/json' }); }
    if (navigator.canShare && file instanceof File && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Backup MacroVision' }).catch(function () { /* annullato */ });
      return;
    }
    if (window.Capacitor && navigator.clipboard) {
      navigator.clipboard.writeText(data).then(function () { toast('Backup copiato negli appunti: incollalo in una nota o in una mail.'); }, function () { toast('Non riesco a esportare il backup su questo dispositivo.', { err: true }); });
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('Backup salvato nei download: ' + name);
    } catch (e) { toast('Non riesco a salvare il file di backup su questo dispositivo.', { err: true }); }
  }
  function importBackup(file) {
    var rd = new FileReader();
    rd.onload = function () {
      var j = null;
      try { j = JSON.parse(rd.result); } catch (e) { j = null; }
      if (!j || j.app !== 'MacroVision' || !j.state || j.state.v !== 2) { toast('Questo file non è un backup di MacroVision.', { err: true }); return; }
      var nd = Object.keys(j.state.days || {}).length;
      confirmSheet({ title: 'Ripristinare il backup?', text: 'Il backup contiene ' + nd + ' giorni di diario. I dati attuali su questo telefono verranno sostituiti.', ok: 'Ripristina', onOk: function () {
        var key = S.aiKey;
        S = Object.assign(fresh(), j.state); S.demo = false; S.onboarded = true;
        if (key) S.aiKey = key;
        save(true); renderAll(); toast('Backup ripristinato');
      } });
    };
    rd.onerror = function () { toast('Non riesco a leggere il file.', { err: true }); };
    rd.readAsText(file);
  }

        inner.innerHTML = dots + '<h1>Il tuo obiettivo giornaliero</h1>' +
          '<div class="goal-big"><b class="num">' + f0(g.kcal) + '</b><div class="muted">kcal al giorno</div></div>' +
          '<div class="card"><dl class="kv"><dt><span class="dot c-pro"></span>Proteine</dt><dd class="num">' + g.p + ' g</dd><dt><span class="dot c-carb"></span>Carboidrati</dt><dd class="num">' + g.c + ' g</dd><dt><span class="dot c-fat"></span>Grassi</dt><dd class="num">' + g.f + ' g</dd><dt>Acqua</dt><dd class="num">' + f1(g.water * 0.25) + ' l</dd></dl></div>' +
          '<p class="note">Stima con la formula di Mifflin-St Jeor' + (prof.goal === 'lose' ? ' e un deficit moderato del 15%' : prof.goal === 'gain' ? ' e un surplus del 10%' : '') + '. Puoi cambiare gli obiettivi quando vuoi dal Profilo. Non sostituisce il parere di un medico o di un nutrizionista.</p>' +
          '<div class="spacer"></div><button class="btn primary block" id="o-next">Inizia</button><button class="btn ghost block" id="o-back">Indietro</button>';
        $('#o-next').onclick = function () { S.profile = prof; S.goals = g; S.goalsCustom = false; addWeightIfNew(prof.weight); finish(); };
        $('#o-back').onclick = function () { step = 2; draw(); };
      }
      box.scrollTop = 0;
    }
    function finish() {
      S.onboarded = true; S.demo = false;
      save(true);
      box.hidden = true;
      document.body.style.overflow = '';
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ok */ }
      renderAll();
    }
    draw();
  }

  /* ================= Dati di esempio (solo anteprima) ================= */
  function seedDemo() {
    S = fresh(); S.demo = true; S.onboarded = true;
    S.profile = { sex: 'm', age: 36, height: 178, weight: 81, activity: 1.55, goal: 'lose' };
    S.goals = calcGoals(S.profile);
    var find = function (n) { return DB.concat(DBX).filter(function (f) { return f.name === n; })[0]; };
    var menus = [
      [['colazione', 'Yogurt greco 0%', 170], ['colazione', 'Fiocchi d\'avena', 40], ['colazione', 'Mirtilli', 80], ['pranzo', 'Pasta di semola (secca)', 90], ['pranzo', 'Passata di pomodoro', 120], ['pranzo', 'Parmigiano Reggiano', 10], ['pranzo', 'Olio extravergine d\'oliva', 10], ['spuntini', 'Mela', 160], ['cena', 'Petto di pollo, alla griglia', 130], ['cena', 'Zucchine, alla griglia', 220], ['cena', 'Pane integrale', 60], ['cena', 'Olio extravergine d\'oliva', 10]],
      [['colazione', 'Cappuccino (senza zucchero)', 150], ['colazione', 'Cornetto semplice', 55], ['pranzo', 'Riso bianco (crudo)', 80], ['pranzo', 'Tonno al naturale (sgocciolato)', 80], ['pranzo', 'Pomodori', 150], ['pranzo', 'Olio extravergine d\'oliva', 10], ['spuntini', 'Mandorle', 25], ['cena', 'Salmone, al forno', 130], ['cena', 'Patate, al forno', 160], ['cena', 'Insalata (lattuga)', 80]],
      [['colazione', 'Latte parzialmente scremato', 200], ['colazione', 'Fette biscottate', 30], ['colazione', 'Marmellata / confettura', 20], ['pranzo', 'Pasta integrale (secca)', 80], ['pranzo', 'Ceci lessati / in scatola', 120], ['pranzo', 'Olio extravergine d\'oliva', 10], ['spuntini', 'Yogurt greco 0%', 170], ['cena', 'Pizza margherita', 320], ['cena', 'Birra chiara', 330]]
    ];
    var t0 = today0(), seed = 3;
    var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (var i = 13; i >= 0; i--) {
      if (i === 9 || i === 4) continue;
      var k = dkey(addDays(t0, -i)), day = getDay(k), menu = menus[i % 3];
      menu.forEach(function (m) {
        if (i === 0 && m[0] === 'cena') return;
        var f = find(m[1]);
        if (!f) return;
        var q = m[2] * (0.85 + rnd() * 0.3);
        q = f.base.u === 'porz.' ? r1(q) : Math.round(q / 5) * 5;
        if (f.units) { var ug = f.units[0].g; q = r1(Math.max(0.5, Math.round(q / ug * 2) / 2) * ug); }   // porzioni intere: 1 vasetto, 2 fette
        day.entries.push(Object.assign(foodFields(f), { id: uid() + i, meal: m[0], qty: q, t: Date.now() }));
        touchFood(f, q);
      });
      day.water = i === 0 ? 4 : 6 + Math.round(rnd() * 4);
    }
    var kg = 82.4;
    for (var j = 30; j >= 0; j -= 3) { kg -= 0.12 + rnd() * 0.2 - 0.06; S.weights.push({ d: dkey(addDays(t0, -j)), kg: r1(kg) }); }
    S.profile.weight = S.weights[S.weights.length - 1].kg;
    ['db:Yogurt greco 0%', 'db:Fiocchi d\'avena', 'db:Petto di pollo|griglia'].forEach(function (k2) { if (S.foods[k2]) S.foods[k2].fav = true; });
    save(true);
  }

  /* ================= Navigazione ================= */
  var UI = { view: 'diario', date: today0(), range: 7, cibi: 'recenti', addMeal: null };
  function setView(v) {
    UI.view = v;
    $$('.view').forEach(function (s) { s.classList.toggle('on', s.id === 'v-' + v); });
    $$('.nav [data-view]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === v); if (b.getAttribute('data-view') === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#datenav').hidden = v !== 'diario';
    renderAll();
    window.scrollTo(0, 0);
  }
  function renderTop() {
    $('#d-label').textContent = dayLabel(UI.date);
    $('#d-next').disabled = dayDiff(UI.date) >= 0;
    $('#d-next').style.opacity = dayDiff(UI.date) >= 0 ? '.3' : '1';
  }
  function renderAll() {
    renderTop();
    if (UI.view === 'diario') renderDiary();
    else if (UI.view === 'progressi') renderProgress();
    else if (UI.view === 'cibi') renderCibi();
    else renderProfilo();
  }

  function init() {
    $('#brand').innerHTML = LOGO + '<b>MacroVision</b>';
    $('#d-prev').innerHTML = icon('left', 'sm');
    $('#d-next').innerHTML = icon('right', 'sm');
    $$('.nav [data-view]').forEach(function (b) {
      var v = b.getAttribute('data-view');
      b.innerHTML = icon({ diario: 'diary', progressi: 'chart', cibi: 'star', profilo: 'user' }[v]) + '<span>' + b.textContent + '</span>';
      b.onclick = function () { if (Sheet.isOpen()) Sheet.close(); setView(v); };
    });
    $('#fab').innerHTML = icon('plus');
    $('#fab').onclick = function () { openAdd(null); };
    $('#d-prev').onclick = function () { UI.date = addDays(UI.date, -1); renderAll(); };
    $('#d-next').onclick = function () { if (dayDiff(UI.date) < 0) { UI.date = addDays(UI.date, 1); renderAll(); } };
    var pick = $('#d-pick');
    pick.max = dkey(today0());
    $('#d-label').onclick = function () {
      pick.value = dkey(UI.date);
      try { if (pick.showPicker) { pick.showPicker(); return; } } catch (e) { /* ripiego */ }
      UI.date = today0(); renderAll();
    };
    pick.onchange = function () { if (pick.value) { var a = pick.value.split('-').map(Number), d = new Date(a[0], a[1] - 1, a[2]); if (dayDiff(d) <= 0) { UI.date = d; renderAll(); } } };
    Sheet.init();
    buildDiary();
    if (firstRun && window.MV_DEMO) { seedDemo(); firstRun = false; }
    setView('diario');
    if (!S.onboarded) showOnboarding();
    var resizeT = 0;
    window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (UI.view === 'progressi') renderProgress(); }, 200); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && dkey(UI.date) !== dkey(today0()) && UI.lastDay && UI.lastDay !== dkey(today0())) { UI.date = today0(); renderAll(); }
      UI.lastDay = dkey(today0());
    });
    UI.lastDay = dkey(today0());
    // link esterni (Google AI Studio, Open Food Facts) nel browser del telefono quando l'app è quella Android
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[target=_blank]');
      if (a && NATIVE && NATIVE.openUrl) { e.preventDefault(); try { NATIVE.openUrl(a.href); } catch (x) { /* ok */ } }
    });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.MV_DEMO && !window.Capacitor && !NATIVE) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline non disponibile */ }); });
    }
  }

  window.MV_TEST = { calcGoals: calcGoals, gtinFromRaw: gtinFromRaw, parseOff: parseOff, normalizeAI: normalizeAI, searchLocal: searchLocal, state: function () { return S; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
